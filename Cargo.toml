[package]
name = "purge"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Purge - neon-grade Windows junk cleaner: accurate orphan detection, package-manager management and browser update control"
authors = ["you"]
license = "MIT"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
walkdir = "2.5"
rayon = "1.12"
dirs = "7.0"
trash = "5.4"
open = "5.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
sysinfo = "0.40"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 2
